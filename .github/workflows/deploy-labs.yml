# Deploy the labs (Modal app wetlab-playground) on every merge to main, the way Vercel deploys the
# website. Needs two repository secrets: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (a Modal token).
# Changes to the website alone (web/) don't redeploy the labs; a manual run is under Actions.
name: Deploy labs to Modal

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-labs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Modal
        run: pip install modal
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy hosting/app.py
